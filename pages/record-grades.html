<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"></head>
<body>
     <nav>
        <h1>Prime Touch <span>Portal</span></h1>
        <ul class="user-profile">
            <li><p class="user-name"></p></li> 
            <li><a href="/pages/forgot-password.html">Change password</a></li> 
            <li><button class="log-out-btn">log out</button></li>
        </ul>
    </nav>

    <main>
      <header>
        <p></p>
        <h2>Record Grades</h2>
        <p>Select a term and a subject to enter Test 1, Test 2, Exam scores for your class</p>
      </header>

      <section class="term-subject-container">
            <div class="term-picker">
                <button class="term">First Term</button>
                <button class="term">Second Term</button>
                <button class="term">Third Term</button>
            </div>
            <select name="subject-select" id="">
                <options value="Select a subject">Select a subject</options>
                <options value="Mathematics">Mathematics</options>
                <options value="English">English</options>
                <options value="Physics/Govr/Commerce">Physics/Government/Commerce</options>
                <options value="Chemistry/lit-in-Eng/Financial Acc">Chemistry/literature/Financial Accounting</options>
                <options value="Biology/CRS/Economics">Biology/CRS/Economics</options>
                <options value="Further Mathermatics">Further Mathematics</options>
                <options value="Agricultural Science">Agricultural Science</options>
                <options value="Marketing">Marketing</options>
                <options value="Civic Education">Civic Education</options>
            </select>
      </section>

      <section class="subject-grades-stats">
        <div class="stat">
            <p></p>
        </div>
        <div class="stat">
            <p></p>
        </div>
      </section>

      <section class="main-grades-container">
       
      </section>
      <button>Save Grades</button>
    </main>
    <script type="module" src="/scripts/controllers/record-grades.js"></script>
</body>
</html>
