<body>
    <nav>
        <h2>Prime Touch <span>Portal</span></h2>
        <section class=info-section>
            <section>
            <a href="/pages/forgot-password.html">Change Password</a>
            <button class="logout-btn">log out</button>
            </section>
            <div>
                <img src="/images/user.png">
                <p class="admin-name"></p>
            </div>
        </section>
    </nav>
    <section class="banner">
        <section>
            <h3>Students</h3>
            <section class="instruction-btn">
                <p>View, add, and manage every student enrolled at Prime Touch including their class placement and guardian contact</p>
                <button class="add-button">+ Add Student</button> 
            </section>
        </section>
    </section>
    <section class="Search-banner">
        <input class="search-bar" placeholder="Search students...">
        <select>
            <option value="All Classes">All Classes</option>
            <option value="Js">Js1</option>
            <option value="Js">Js2</option>
            <option value="Js">Js3</option>
            <option value="Ss1">Ss1</option>
            <option value="Ss2">Ss2</option>
            <option value="Ss3">Ss3</option>
        </select>
    </section>
<form class="add-student-form hidden">
    <header>
        <div>
            <h3>Add student</h3>
            <button>close</button>
        </div>
        <p>This creates a student profile and enrolls them in the selected class.</p>
    </header>
    <main>
        <label>
           Full name
            <input class="name-input" type="text" placeholder="e.g. Chidinma">
        </label>
        <section>
            <label for="">
                Date of Birth
                <input class="date-input" type="date" placeholder="">
            </label>
            <label for="">
                Class
                <select class="class-select">
                    <option value="Select a class">Select a class</option>
                    <option value="Js1">Js1</option>
                    <option value="Js2">Js2</option>
                    <option value="Js3">Js3</option>
                    <option value="Ss1">Ss1</option>
                    <option value="Ss2">Ss2</option>
                    <option value="Ss3">Ss3</option>
                </select>
            </label>
            <label for="">
                Guardian/Parent No
                <input class="guardian-No" type="tel" placeholder="+234 800 000 000">
            </label>
            <label for="">
                Email
                <input class="email-input" type="email" placeholder="student@greendale.edu">
            </label>
        </section>
    </main>
  <footer>
    <button>Cancel</button>
    <button type="button" class="add-btn">Add button</button>
  </footer>
</form>
