<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles/attendance.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"></head>
<body>
     <nav>
        <h1>Prime Touch <span>Portal</span></h1>
        <ul class="user-profile">
            <li><p class="user-name"></p></li> 
            <li><a href="/pages/forgot-password.html">Change password</a></li> 
            <li><button class="log-out-btn">log out</button></li>
        </ul>
    </nav>

    <main>
        <header>
            <p class="tag"></p>
            <h2>Mark Attendance</h2>
            <p class="action-instruction">Mark Each student present or absent for the selected date.Attendance can only be edited on the day it was taken.</p>
        </header>
     
        <section class="stats">
            <div class="stat-card">
                <h3 class="stat-number average"></h3>
                <p class="stat-description">Average attendance this term</p>
            </div>
            <div class="stat-card">
                <h3 class="stat-number noOfDays"></h3>
                <p class="stat-description">School days recorded so far</p>
            </div>
            <div class="stat-card">
                <h3 class="stat-number studentBelow80"></h3>
                <p class="stat-description">Student below 80% attendance</p>
            </div>
        </section>

        <section class="outer-attendance-container">
          <header>
            <section class="date-term-pickers">
            <aside class="date-select">
              <button class="prev-btn">&lt;</button>
              <div class="date">
                <p class="day"></p>
                <p class="full-date"></p>
              </div>
              <button class=next-btn>&gt;</button>
            </aside>

            <section class="term-picker">
                <button class="term">First Term</button>
                <button class="term">Second Term</button>
                <button class="term">Third Term</button>
            </section>
            </section>
            <footer>
            <p class="editable-state"></p>
            </footer>
          </header>
       <p class="instruction"></p>
          <section class="mark-attendance-container">

          </section>
          <footer>
             <button class="save-attendance-btn">Save attendance</button>
          </footer>
        </section>
        <div class="toast-message">
        <p>You have not done something</p>
    </div>
    </main>

    <script type="module" src="/scripts/controllers/attendance.js"></script>
</body>
</html>
