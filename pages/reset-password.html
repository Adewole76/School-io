<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../styles/reset-password.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>

    <form>
        <header>
            <section>
                <div>
                    <img src="/key.png" alt="">
                </div>
            </section>
       <h2>Enter your reset code</h2> 
       <p>We sent a 6-digit code to your email</p>
       <p>&#9679; Expires 15minutes after request . single use</p>
       </header>
       <label for="">
        Reset code
        <input class="reset-code-input" type="number" placeholder="000000">
       </label>
       <label for="">
        New password
        <input class="reset-password-input" type="text" placeholder="New password">
       </label>
       <label for="">
        Confirm password
        <input class="confirm-password-input" type="text" placeholder="Confirm password">
       </label>
       <p>Re-enter the same password to confirm</p>
       <button type="button" class="reset-btn">Reset Password</button>
     <a href="/index.html">&larr; Back to sign in</a>
    </form>
    
    <script type="module" src="/scripts/controllers/reset-password.js"></script>
</body>
