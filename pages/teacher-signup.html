<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles/teacher-signup.css">
</head>
<body>
    <form action="">
        <h3>School.io Portal</h3>

        <h2>Teacher sign up</h2>
        <p>Create your account, then wait for the admin to assign you to a class before you can access student data</p>
        <label for="">
            Full Name
            <input type="text" placeholder="Full name">
        </label>
        <label for="">
            Email address
            <input type="email" placeholder="Email">
        </label>
        <label for="">
           Subject you teach
           <select name="" id="">
            <option value="Pick your subjec">Pick your subject</option>
            <option value="Mathematics">Mathematics</option>
            <option value="English">English</option>
            <option value="Physics">Physics</option>
            <option value="Marketing">Marketing</option>
            <option value="Civic Education">Civic Education</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Biology">Biology</option>
            <option value="Further Mathematics">Mathematics</option>
            <option value="Economics">Economics</option>
           </select>
        </label>
        <label for="">
           Password
            <input type="text" placeholder="password">
        </label>
        <label for="">
            Confirm Password
            <input type="text" placeholder="confirm password">
        </label>
        <button class="create-teacher" type="button">Create account</button>
    <p>You won't see any class or student data until the admin assigns you too a class - this is normal for new accounts</p>
<p>Already have an account?<a>Sign in</a></p>    
</form>
    <script type="module" src="/scripts/controllers/teacher-signup.js"></script>
</body>
</html>
