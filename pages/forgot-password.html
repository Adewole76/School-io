<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles/forgot-password.css">


    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
<!-- 2. Initialize with your Public Key -->
<script type="text/javascript">
    (function() {
        emailjs.init({
            publicKey: "fE1t16ddwBV1pRz-G", // Replace with your actual public key
        });
    })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"></head>
<body>
    <form action="">
        <header>
            <section>
            <div class="img-container"><img class="mail-img" src="/email.png" alt=""></div>
            </section>
            <h2>Forgot your password?</h2>
            <p>Enter the email on your account and we'll send you a code to reset it</p>
        </header>
        <label for="">
            Email address
            <input class="email-input" placeholder="you@gmail.com">
        </label>
        <button type="button" class="send-btn">Send reset code</button>
        <a href="/index.html">&larr; Back to sign in</a>
    </form>
    <script type="module" src="/scripts/controllers/forgot-password.js"></script>
</body>
</html>
