<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles/teacher-dashboard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"></head>
<body>
    <nav>
        <h3>School.io portal</h3>
        <section class="user-profile">
            <p class="user-name"></p> 
            <a href="">change password</a> 
            <button class="log-out-btn">log out</button>
        </section>
    </nav>

    <section class="main-container">
       <header>
        <h1>You're all set - almost.</h1>
        <p class="instruction">Your account has been created, but you haven't been assigned to a class yet. Once the admin assigns you, your class roster, attendance, and grade tools will appear here.</p>
       </header>
       <section class="account-details">
        <div>
            <p>Account</p>
            <footer><p class="user-name-2"></p> &bull; <p class="user-subject"></p></footer>
        </div>
        <hr>
        <div>
          <p>Class assignment</p>
          <p class="assignment-status"></p>
        </div>
       </section>
    </section>
    <script type="module" src="/scripts/controllers/teacher-dashboard.js"></script>
</body>
</html>
