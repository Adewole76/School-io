<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/styles/teacher-dashboard.css">
</head>
<body>
    <nav>
        <h3>School.io portal</h3>
        <section class="user-profile">
            <p class="user-name"></p> 
            <a href="">change password</a> 
            <button class="log-out-btn">log out</button>
        </section>
    </nav>

    <section class="main-container">
       <header>
        <h1>You're all set - almost.</h1>
        <p class="instruction">Your account has been created, but you haven't been assigned to a class yet. Once the admin assigns you, your class roster, attendance, and grade tools will appear here.</p>
       </header>
       <section class="account-details">
        <div>
            <p>Account</p>
            <footer><p class="user-name-2"></p> &bull; <p class="user-subject"></p></footer>
        </div>
        <hr>
        <div>
          <p>Class assignment</p>
          <p class="assignment-status"></p>
        </div>
       </section>
    </section>
    <script type="module" src="/scripts/controllers/teacher-dashboard.js"></script>
</body>
</html>
